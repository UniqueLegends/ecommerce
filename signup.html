<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class = "d-flex justify-content-center align-items-center vh-100">
    <form action="signup.php" method="post" class="w-50 bg-warning p-3 rounded-3" onsubmit="return validate()">
    <h3 class="text-center">Signup here</h3>
    <input type = "text" placeholder="Username" name="username" class = "form-control mt-3 rounded" required>
    <input type = "password" placeholder="Password" name="password" class = "form-control mt-2 rounded" id="pass1" required>
    <input type = "password" placeholder="Confirm Password" name="password2" class = "form-control mt-2 rounded" id="pass2" required>
     <select name="usertype" class = "form-control mt-2 rounded" required>
        <option  value = "Vendor">Vendor</option>
        <option  value = "Customer">Customer</option>
     </select>

     <div class = "text-center mt-3">
     <button class = "btn btn-success">Signup</button>
     <button class = "btn btn-success" onclick="location.href='login.html'">Go to Login</button>


    </div>

    </form>

    <script>
        function validate(){
        pass1Obj = document.getElementById("pass1");
        pass2Obj = document.getElementById("pass2");
        if(pass1Obj.value == pass2Obj.value){
            return true
        }
        else{
            alert("password does not match")
            return false
        }
    }
    </script>
</div>
</body>
</html>
